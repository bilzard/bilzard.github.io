<footer class="site-footer">
  <div class="wrapper">
    <p class="site-foot-note">
      © {{ site.time | date: "%Y" }} {{ site.author }}. All rights reserved.
    </p>

    {% if site.plugins contains "jekyll-feed" %}
    <div class="footer-icons">
        <a href="{{ "/feed.xml" | absolute_url }}" aria-label="RSS feed">
            <svg xmlns="http://www.w3.org/2000/svg" id="RSSicon" viewBox="0 0 8 8" width="24" height="24">
                <rect class="rss-button" width="8" height="8" rx="1.5"/>
                <circle class="rss-symbol" cx="2" cy="6" r="1"/>
                <path class="rss-symbol" d="m 1,4 a 3,3 0 0 1 3,3 h 1 a 4,4 0 0 0 -4,-4 z"/>
                <path class="rss-symbol" d="m 1,2 a 5,5 0 0 1 5,5 h 1 a 6,6 0 0 0 -6,-6 z"/>
            </svg>
        </a>
    </div>
    {% endif %}
  </div>
</footer>
